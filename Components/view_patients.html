{% extends "base.html" %}

{% block content %}

<h2>Patients</h2>

<form method="get">
    <input type="text" name="search" placeholder="Search patient">
    <button type="submit">Search</button>
</form>

{% for patient in patients %}
    <p>
        {{ patient.username }}
        <a href="/doctor/patient/{{ patient.username }}">View</a>
    </p>
{% endfor %}

{% endblock %}
